name: CI — Paddy Multi-Agent System

on:
  push:
    branches: [main, demo, "feature/**", "integration/**"]
  pull_request:
    branches: [main, demo]

env:
  REGISTRY: ghcr.io

jobs:

  proto-check:
    name: Proto — stubs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install protoc + plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Regenerate Go stubs into a temp dir
        run: |
          mkdir -p /tmp/gen
          protoc -I proto --go_out=/tmp/gen --go_opt=paths=source_relative \
                 --go-grpc_out=/tmp/gen --go-grpc_opt=paths=source_relative \
                 proto/paddy_agents.proto
      - name: Check every service/message in the proto exists in committed Go stubs
        run: |
          for svc in $(grep -oP '^service \K\w+' proto/paddy_agents.proto); do
            grep -q "${svc}Client" proto/paddy_agents_grpc.pb.go || { echo "::error::$svc missing from committed Go stubs — regenerate"; exit 1; }
          done
          for msg in $(grep -oP '^message \K\w+' proto/paddy_agents.proto); do
            grep -q "^type ${msg} struct" proto/paddy_agents.pb.go || { echo "::error::$msg missing from committed Go stubs — regenerate"; exit 1; }
          done
          echo "Go stubs cover all services and messages"

  go:
    name: Go — vet, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Build orchestrator, weather, pest-risk
        run: |
          go build -o /dev/null ./go/orchestrator
          go build -o /dev/null ./go/agents/weather
          go build -o /dev/null ./go/agents/pest_risk
      - run: go test ./go/...

  python:
    name: Python — agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Byte-compile all agents
        run: python -m compileall -q python/agents python/shared streamlit_dashboard
      - name: Check committed Python stubs import and expose all services
        run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "python/shared")
          import paddy_agents_pb2 as pb
          want = re.findall(r"^service (\w+)", open("proto/paddy_agents.proto").read(), re.M)
          missing = [s for s in want if s not in pb.DESCRIPTOR.services_by_name]
          assert not missing, f"Python stubs missing services: {missing} — regenerate"
          print("Python stubs OK:", want)
          PY
      - run: python -m pytest python/agents -q

  docker-build:
    name: Docker — build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [proto-check, go, python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: orchestrator,       file: docker/Dockerfile.orchestrator}
          - {name: weather-agent,      file: docker/Dockerfile.weather}
          - {name: pest-risk-agent,    file: docker/Dockerfile.pest_risk}
          - {name: dashboard,          file: docker/Dockerfile.dashboard}
          - {name: soil-agent,         file: docker/Dockerfile.python_agent, args: "AGENT_DIR=soil_agent\nAGENT_SCRIPT=soil_agent.py"}
          - {name: crop-health-agent,  file: docker/Dockerfile.python_agent, args: "AGENT_DIR=crop_health_agent\nAGENT_SCRIPT=server.py"}
          - {name: market-agent,       file: docker/Dockerfile.python_agent, args: "AGENT_DIR=market_price_agent\nAGENT_SCRIPT=market_agent.py"}
          - {name: income-agent,       file: docker/Dockerfile.python_agent, args: "AGENT_DIR=income_agent\nAGENT_SCRIPT=income_agent.py"}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image name
        # registry repository names must be lowercase; the owner (e.g. AdiXgit) is not
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/paddy-${{ matrix.name }}:latest" >> "$GITHUB_ENV"
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
