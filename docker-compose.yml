# ─────────────────────────────────────────────
# Karnataka Paddy Multi-Agent System
# Go orchestrator + Go agents (weather, pest-risk) + Python agents
# (soil, crop-health, market, income) + Streamlit dashboard
#
# Ports: orchestrator 50051 | weather 50052 | soil 50053 | crop-health 50054
#        market 50055 | pest-risk 50056 | income 50057 | dashboard 8501
# ─────────────────────────────────────────────

x-py-health: &py-health
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

networks:
  paddy-net:
    driver: bridge

services:

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: paddy-orchestrator
    ports: ["50051:50051"]
    environment:
      - ORCHESTRATOR_PORT=50051
    networks: [paddy-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 5s
      timeout: 3s
      retries: 6

  weather-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.weather
    container_name: paddy-weather-agent
    ports: ["50052:50052"]
    environment:
      - WEATHER_AGENT_PORT=50052
      - ORCHESTRATOR_ADDR=orchestrator:50051
    networks: [paddy-net]
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50052"]
      interval: 5s
      timeout: 3s
      retries: 6

  soil-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.python_agent
      args:
        AGENT_DIR: soil_agent
        AGENT_SCRIPT: soil_agent.py
    container_name: paddy-soil-agent
    ports: ["50053:50053"]
    environment:
      - SOIL_AGENT_PORT=50053
      - ORCHESTRATOR_ADDR=orchestrator:50051
    networks: [paddy-net]
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50053), 3)"]
      <<: *py-health

  crop-health-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.python_agent
      args:
        AGENT_DIR: crop_health_agent
        AGENT_SCRIPT: crop_health_agent.py
    container_name: paddy-crop-health-agent
    ports: ["50054:50054"]
    environment:
      - CROP_HEALTH_AGENT_PORT=50054
      - ORCHESTRATOR_ADDR=orchestrator:50051
      - AI_ML_XLSX_PATH=/app/data/Karnataka_Paddy_AI_ML_Dataset.xlsx
      - MAIN_CSV_PATH=/app/data/Karnataka_Paddy_Main_Dataset.csv
      # NASA POWER is free; set Sentinel Hub creds for real NDVI
      - SENTINEL_HUB_CLIENT_ID=${SENTINEL_HUB_CLIENT_ID:-}
      - SENTINEL_HUB_CLIENT_SECRET=${SENTINEL_HUB_CLIENT_SECRET:-}
    networks: [paddy-net]
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50054), 3)"]
      <<: *py-health

  market-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.python_agent
      args:
        AGENT_DIR: market_price_agent
        AGENT_SCRIPT: market_agent.py
    container_name: paddy-market-agent
    ports: ["50055:50055"]
    environment:
      - MARKET_AGENT_PORT=50055
      - ORCHESTRATOR_ADDR=orchestrator:50051
    networks: [paddy-net]
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50055), 3)"]
      <<: *py-health

  pest-risk-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.pest_risk
    container_name: paddy-pest-risk-agent
    ports: ["50056:50056"]
    environment:
      - PEST_RISK_AGENT_PORT=50056
      - ORCHESTRATOR_ADDR=orchestrator:50051
    networks: [paddy-net]
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50056"]
      interval: 5s
      timeout: 3s
      retries: 6

  income-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.python_agent
      args:
        AGENT_DIR: income_agent
        AGENT_SCRIPT: income_agent.py
    container_name: paddy-income-agent
    ports: ["50057:50057"]
    environment:
      - INCOME_AGENT_PORT=50057
      - SOIL_AGENT_ADDR=soil-agent:50053
      - MARKET_AGENT_ADDR=market-agent:50055
    networks: [paddy-net]
    depends_on:
      soil-agent: {condition: service_healthy}
      market-agent: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50057), 3)"]
      <<: *py-health

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: paddy-dashboard
    ports: ["8501:8501"]
    environment:
      - ORCHESTRATOR_ADDR=orchestrator:50051
      - WEATHER_AGENT_ADDR=weather-agent:50052
      - SOIL_AGENT_ADDR=soil-agent:50053
      - CROP_HEALTH_AGENT_ADDR=crop-health-agent:50054
    networks: [paddy-net]
    depends_on:
      orchestrator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      <<: *py-health
